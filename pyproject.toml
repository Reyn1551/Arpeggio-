[project]
name = "arpeggio-ai"
version = "0.0.1"
description = "Personal AI workbench that routes coding tasks across agents and models"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1,<1",
    "pydantic>=2.13.5,<3",
    "rich>=15.0.0",
    "typer>=0.27.3",
]

[project.scripts]
arpeggio = "arpeggio_ai.cli.app:app"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.format]
# Docs snippets are illustrative and hand-aligned; keep them as written.
exclude = ["*.md"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]
files = ["src/arpeggio_ai"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--strict-config", "-m", "not live"]
markers = [
    "live: calls a real provider and may cost money; run with ARPEGGIO_LIVE=1 and -m live",
]

[tool.coverage.run]
source = ["arpeggio_ai"]
branch = true

[tool.coverage.report]
show_missing = true
